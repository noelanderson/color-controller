name: Publish firmware reference

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-doxygen.yml"
      - "Doxyfile"
      - "src/ColorController/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Doxygen HTML
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Doxygen
        run: choco install doxygen.install --yes --no-progress

      - name: Generate firmware reference
        run: doxygen Doxyfile

      - name: Require warning-free output
        run: |
          if (-not (Test-Path "build\doxygen\html\index.html")) {
            throw "Doxygen did not generate build\doxygen\html\index.html"
          }
          if ((Get-Item "build\doxygen\warnings.log").Length -ne 0) {
            Get-Content "build\doxygen\warnings.log"
            throw "Doxygen generated documentation warnings"
          }

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/doxygen/html

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5
